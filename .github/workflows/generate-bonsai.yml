name: Grow Git Bonsai

on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-bonsai.yml'

permissions:
  contents: write

concurrency:
  group: profile-git-bonsai
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Grow bonsai from GitHub activity
        uses: egorthinks/git-bonsai@v1
        with:
          user: VasilijEpishkin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-dir: assets/bonsai
          season: auto
          commit: 'false'

      - name: Verify generated bonsai images
        run: |
          test -s assets/bonsai/bonsai.gif
          test -s assets/bonsai/bonsai-growth.gif
          test -s assets/bonsai/bonsai.svg

      - name: Commit images and safely publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bonsai/
          if git diff --cached --quiet; then
            echo "Bonsai has not changed."
            exit 0
          fi
          git commit -m "chore: grow profile bonsai [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retry $attempt"
          done
          echo "Failed to publish bonsai after three retries"
          exit 1
