name: Update contribution animation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-contribution-animation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate SVG animations
        uses: Man0dya/Readme-Contribution-Graph-Generator@1ec3fd750504af2867d746d059c1a3ec79f219f0
        with:
          github_user_name: VasilijEpishkin
          github_token: ${{ secrets.GITHUB_TOKEN }}
          speed: normal
          max_targets: 75
          output_dir: assets

      - name: Commit updated graphics only when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-animation.svg assets/github-contribution-animation-dark.svg
          if git diff --cached --quiet; then
            echo "No changes in contribution graphics."
          else
            git commit -m "chore: refresh contribution graphics [skip ci]"
            git push
          fi
